'use strict';const UNITS=[["國家級", "認知作戰究竟是什麼？", "先辨識行動者、目標、手段、受眾與證據；它不等於所有假訊息。", "國家級影響行動通常試圖改變群體對現實的理解、信任與決策。判斷個別事件是否構成認知作戰，需要證據支持，不能只看內容是否令人不舒服。", "一篇讓你憤怒的文章是否必然是認知作戰？", "否。需要調查來源、協同行為、目的與證據。", "S1-P001"], ["國家級", "假訊息、宣傳與認知作戰", "辨識概念差異，不把所有錯誤訊息混為一談。", "假訊息描述資訊真偽問題；宣傳著重說服；認知作戰則關注有策略的影響行動。它們可能重疊，但不能互相取代。", "看到錯誤數字就能推斷幕後是外國政府？", "不能。錯誤資訊與來源歸因是兩個不同問題。", "S1-I001"], ["國家級", "誰在操作？如何歸因？", "區分已知事實、合理推測和未證實指控。", "觀察帳號來源、協同行為、資金、時間序列與可追溯紀錄；單一匿名帳號或相似口號不足以證明特定國家介入。", "多個帳號同時轉發能證明政府指揮嗎？", "不一定，須有更多獨立證據。", "S1-P001"], ["國家級", "情緒、敘事與群體認同", "了解恐懼、憤怒、羞辱如何提高傳播意願。", "內容可能利用對立框架、選擇性事實、恐懼敘事及身份認同來影響判斷；情緒本身不是證據。", "越讓人生氣的內容越可信嗎？", "否。先辨識情緒，再查原始脈絡。", "S1-I003"], ["國家級", "傳播鏈與協同放大", "理解內容如何跨平台、社群和媒體擴散。", "分析誰先發布、誰接力、何時放大；區分自然傳播與可能的協調操作。", "轉發數很高就代表內容是真的嗎？", "否。熱度不是可靠性指標。", "S1-I002"], ["國家級", "真實案例的證據地圖", "用原始研究拆解主張、材料、限制與未知。", "從研究提出的案例開始，依序記錄主張、原始資料、研究方法與限制；網站不自行補造未核實的具體事件細節。", "看到案例摘要，應先查什麼？", "查原始研究、資料來源及作者如何得出結論。", "S1-P001"], ["國家級", "五步查證法", "停、找、比、判、再分享。", "先暫停轉傳；找原始來源；跨來源比較；標示確定與未知；最後決定是否分享。", "訊息缺少日期，最好的第一步是？", "查找最初發布時間與完整上下文。", "S1-I001"], ["國家級", "不確定時如何保持判斷", "學會說「目前證據不足」。", "避免把所有異議視為敵對操作，也避免因資訊疲勞而放棄查證。保持可修正的判斷比快速選邊更重要。", "沒有足夠證據時，最好的回答是？", "說明未知與需要的證據，而非強行定論。", "S1-B001"], ["日常人際", "人際操控與一般衝突", "辨識行為模式，而不是替人貼標籤。", "不合理要求、羞辱、威脅與扭曲責任值得注意；單次爭執不等於蓄意操控，更不是國家級認知作戰。", "一次忘記承諾就能認定對方在操控？", "不能。觀察反覆模式、影響與具體行為。", "S2-D001"], ["日常人際", "職場：責任與證據", "主管改口、模糊指示與甩鍋。", "用書面確認任務、日期和責任；聚焦事實與工作流程，避免在未掌握資訊時揣測動機。", "主管否認口頭指示，第一步？", "整理時間線並以中性語氣書面確認。", "S2-D001"], ["日常人際", "職場：功勞與權力差", "被搶功、會議壓力與界線。", "記錄工作成果與合作紀錄，必要時向可信任的主管或人資求助。", "有人把你的成果說成自己的，你可以？", "提出具體貢獻紀錄，避免人身攻擊。", "S2-D001"], ["日常人際", "生活：朋友與群體壓力", "拒絕情緒勒索與「不合群」標籤。", "能尊重對方情緒，同時保留自己選擇的權利。", "朋友說不答應就是不夠義氣，你可以？", "清楚拒絕並維持尊重。", "S2-D001"], ["日常人際", "生活：群組謠言與界線", "查證訊息，也不被逼迫立刻表態。", "朋友轉傳不實資訊不代表他是認知作戰行動者；先查證，再溫和回應。", "群組催你轉傳未證實消息，最好？", "先核對來源，不因壓力轉發。", "S1-I001"], ["日常人際", "感情：隱私與控制", "辨識索取密碼、定位與社交限制。", "親密不代表必須交出所有帳號、定位或社交自主權。尊重與同意是雙向的。", "伴侶要求密碼才能證明愛，你可以？", "表達在乎，同時拒絕交出密碼。", "S2-G001"], ["日常人際", "感情：否認、反轉與困惑", "認識常被稱為DARVO的反應模式，但不隨意診斷。", function inlineSource(id){const s=SOURCES.find(x=>x.id===id);if(!s)return `<div class="source-inline">⚠️ 來源編號 ${esc(id)} 尚未收錄。</div>`;const link=(url,label)=>url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(label)} ↗</a>`:'';return `<div class="source-inline"><strong>📚 本單元參考來源｜${esc(s.id)}</strong><p><strong>${esc(s.title)}</strong></p><p class="tiny">${esc(s.author)} · ${esc(s.date)} · ${esc(s.type)}</p><p class="tiny">查核狀態：${esc(s.status)}</p><div class="source-actions">${link(s.url,'開啟來源')}${s.alternative&&s.alternative!==s.url?link(s.alternative,s.alternativeLabel||'備援連結'):''}${!s.url&&!s.alternative?'<span class="tiny">⚠️ 尚無已確認連結，請勿作為正式引文</span>':''}</div></div>`}
function unitCard(u,i){return `<article class="card unit" id="unit-${i+1}"><div class="number">${String(i+1).padStart(2,'0')}</div><div class="unit-content"><span class="stamp">${esc(u[0])}</span><h3>${esc(u[1])}</h3><p>${esc(u[2])}</p><details class="lesson" open><summary>📖 課程內容、理解題與答案（點此收合／展開）</summary><div class="lesson-body"><p>${esc(u[3])}</p><div class="note"><strong>🧠 思考題：</strong>${esc(u[4])}</div><button class="smallbtn reveal-answer" type="button" aria-expanded="false">✨ 點我查看參考答案</button><div class="answer hidden" aria-live="polite">${esc(u[5])}</div>${inlineSource(u[6])}</div></details></div></article>`}
function course(type){const isN=type==='national',cat=isN?'國家級':'日常人際',list=UNITS.map((u,i)=>({u,i})).filter(x=>x.u[0]===cat);return `<section class="hero" style="background:${isN?'linear-gradient(110deg,#85d7ff,#c6b1ff)':'linear-gradient(110deg,#ffb4d2,#ffe68b)'}"><div><span class="eyebrow">${isN?'🌏 航線 A':'💗 航線 B'}</span><h1>${isN?'國家級認知作戰':'日常人際操控'}</h1><p>${isN?'學會看懂公共資訊的影響操作，從證據出發，不把意見不同當成敵人。':'從工作、朋友、生活到感情關係，觀察行為、守住界線，但不隨意替人貼標籤。'}</p></div>${mascot}</section><section class="section"><div class="track-head"><h2>🗺️ ${list.length} 座知識島</h2><button class="smallbtn" id="toggleLessons" type="button">收合所有課程</button></div><div class="callout"><strong>📖 課程內容已預設展開。</strong>每個單元下方直接顯示參考來源、連結與查核狀態，不用跳到來源資料庫。按「查看參考答案」即可核對。</div><div class="grid">${list.map(({u,i})=>unitCard(u,i)).join('')}</div><div class="callout">${isN?'🔍 判斷「誰在操作」必須有獨立證據。教材中的概念解釋不代表已證實任何未列出的個案。':'🛟 若遇到威脅、暴力、跟蹤或強迫控制，優先確保人身安全並尋求當地專業協助。Let Them 是界線練習，不是認知作戰理論。'}</div></section>`}
function game(){const choices=['職場','生活','感情'];const options=SCENARIOS.map((s,i)=>({s,i})).filter(x=>x.s[0]===gameCategory);if(gameIndex>=options.length)gameIndex=0;const sc=options[gameIndex].s;return `<section class="hero"><div><span class="eyebrow">🎲 不同情境，不同選擇</span><h1>情境練習島</h1><p>選擇類別與故事，看看怎樣回應更能保護判斷與界線。題目是教育情境，不是對人物的診斷。</p></div>${mascot}</section><section class="section"><div class="card purple"><label for="gameCategory"><strong>第一步：選擇生活領域</strong></label><select class="field" id="gameCategory">${choices.map(c=>`<option ${c===gameCategory?'selected':''}>${c}</option>`).join('')}</select><label for="gameStory"><strong>第二步：選擇故事（每類3題）</strong></label><select class="field" id="gameStory">${options.map((x,i)=>`<option value="${i}" ${i===gameIndex?'selected':''}>${esc(x.s[1])}</option>`).join('')}</select><div class="card yellow"><span class="stamp">${esc(sc[0])} · ${esc(sc[1])}</span><h2>💬 你會怎麼做？</h2><p>${esc(sc[2])}</p>${sc[3].map((a,i)=>`<button class="choice ${answered===i?(i===sc[4]?'correct':'wrong'):''}" data-choice="${i}">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}${answered===null?'':`<div class="feedback" role="status">${answered===sc[4]?'🌟 這個選擇較有助於保護界線。':'💡 可以再想想其他方式。'}<br>${esc(sc[5])}</div>`}</div><p><button class="btn secondary" id="nextStory">換一個故事 →</button></p></div><div class="callout">想練習公共資訊判讀？<button class="smallbtn" data-go="national">前往國家級認知作戰課程</button>，每座知識島都有理解題。</div></section>`}
function localInterpret(text){
 const t=text.trim();
 const patterns=[
  {name:'公共資訊／可疑訊息',re:/假消息|謠言|新聞|轉傳|媒體|認知作戰|選舉|政府|政治|帳號|社群|影片|截圖|查證|消息/,steps:['先確認發布日期、原始出處與完整上下文。','比較至少兩個彼此獨立的可靠來源。','不要只因內容情緒強烈就推定特定國家介入。']},
  {name:'職場與權責',re:/主管|同事|公司|工作|報告|交件|加班|會議|績效|老闆|責任|甩鍋|搶功/,steps:['整理可核對的工作紀錄、日期與原始指示。','用中性文字確認分工、期限與優先順序。','若反覆越界，考慮尋求可信任的主管或人資協助。']},
  {name:'親密關係與隱私',re:/伴侶|男友|女友|老公|老婆|戀愛|感情|密碼|定位|分手|親密|約會|吃醋/,steps:['分開描述對方的具體行為與自己對動機的推測。','釐清你願意分享的資訊與不能接受的界線。','如涉及威脅、跟蹤或暴力，優先尋求安全支援。']},
  {name:'朋友與生活壓力',re:/朋友|家人|群組|聚餐|同學|親戚|不合群|義氣|人情|表態/,steps:['確認對方提出了什麼具體要求。','尊重對方感受，同時允許自己說不。','必要時延後回覆，避免在壓力下立即承諾。']}
 ];
 const matches=patterns.filter(p=>p.re.test(t));
 const topics=matches.length?matches:[{name:'一般事件釐清',steps:['先整理事情發生的時間、人物和具體行為。','確認哪些是親身經驗，哪些是尚未查證的猜測。','選擇一個安全、具體、可執行的下一步。']}];
 const safety=/恐嚇|暴力|威脅|跟蹤|被打|傷害|強迫/.test(t);
 const html=(v)=>esc(v);
 return `<div class="feedback" role="status"><strong>🧭 瀏覽器本機解讀</strong><p class="tiny">規則匹配的情境：${topics.map(x=>html(x.name)).join('、')}。這是關鍵字分類與教育性提示，不是 AI 判讀，也不代表對事件真相或對方動機的認定。</p><ol class="bullet"><li><strong>事實：</strong>請標出可核對的原話、日期、訊息或紀錄。</li><li><strong>感受：</strong>你的不舒服值得重視，但感受本身不能證明他人的意圖。</li><li><strong>推論：</strong>哪些結論目前還缺乏獨立證據？</li><li><strong>可採取的行動：</strong><ul>${topics.flatMap(x=>x.steps).slice(0,5).map(x=>`<li>${html(x)}</li>`).join('')}</ul></li></ol>${safety?'<p><strong>🛟 安全提醒：</strong>文字提及可能的人身安全風險。若有立即危險，請優先聯絡當地緊急服務或可信任的支援者。</p>':''}<p class="tiny">🔒 本段文字僅在你的裝置中處理；沒有網路請求、沒有 API Key，也不消耗任何 OpenAI Token。</p></div>`;
}
function practice(){return `<section class="hero"><div><span class="eyebrow">✍️ 可直接輸入，不必登入</span><h1>今日 3 分鐘練習</h1><p>把你遇到的一段訊息或情境寫下來，練習區分「事實、感受、尚未確認的推論、下一步」。</p></div>${mascot}</section><section class="section"><div class="card mint"><label for="practiceInput"><strong>① 寫下你今天想釐清的事情</strong></label><textarea class="field" id="practiceInput" placeholder="例如：主管說這份報告昨天就應該完成，但我記得他說下週……">${esc(practiceText)}</textarea><p class="tiny">🔒 完全在你的瀏覽器內以規則分析，不呼叫 OpenAI API，不消耗站長或訪客的 OpenAI Token；輸入不會上傳或儲存。</p><button class="btn" id="practiceAnalyze">✨ 在瀏覽器產生解讀</button> <button class="btn secondary" id="practiceClear">清空文字</button><div id="practiceResult" aria-live="polite"></div></div></section>`}
function sourceCard(s){const link=(url,label)=>url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(label)} ↗</a>`:'';return `<article class="card source"><div><span class="stamp">${esc(s.id)} · ${esc(s.type)}</span></div><h3>${esc(s.title)}</h3><div class="tiny">${esc(s.author)} · ${esc(s.date)} · ${esc(s.track||'')}</div><p>${esc(s.status)}</p>${link(s.url,'主要入口')}${s.alternative&&s.alternative!==s.url?link(s.alternative,s.alternativeLabel||'備援入口'):''}${!s.url&&!s.alternative?'<span class="tiny">⚠️ 尚無可確認的外部入口，不列為正式引用</span>':''}</article>`}
function sources(){return `<section class="hero"><div><span class="eyebrow">📚 來源與查證狀態透明</span><h1>來源資料庫</h1><p>原始研究、訪談、書籍介紹與候選研究分開標示。連結能開啟不等於內容已閱讀或主張已核實。</p></div>${mascot}</section><section class="section"><div class="card"><label for="sourceSearch"><strong>搜尋來源名稱、作者、編號</strong></label><input class="field" id="sourceSearch" type="search" placeholder="例如：沈伯洋、DARVO、認知作戰"><div class="tiny">若外部網站顯示憑證撤銷警告，請勿繞過；改用備援或其他可靠來源。</div><div id="sourceResults" class="grid" style="margin-top:18px"></div></div></section>`}
function drawSources(query=''){const q=query.trim().toLocaleLowerCase();const matches=SOURCES.filter(s=>[s.id,s.title,s.author,s.type,s.track].join(' ').toLocaleLowerCase().includes(q));document.getElementById('sourceResults').innerHTML=matches.length?matches.map(sourceCard).join(''):'<div class="note">沒有找到相符來源，請更換關鍵字。</div>'}
function bind(){if(page==='national'||page==='daily'){document.querySelectorAll('.reveal-answer').forEach(b=>b.addEventListener('click',()=>{const a=b.nextElementSibling;const hidden=a.classList.toggle('hidden');b.setAttribute('aria-expanded',String(!hidden));b.textContent=hidden?'✨ 點我查看參考答案':'🙈 收起參考答案'}));const toggle=document.getElementById('toggleLessons');toggle.addEventListener('click',()=>{const details=[...document.querySelectorAll('details.lesson')];const open=details.some(d=>d.open);details.forEach(d=>d.open=!open);toggle.textContent=open?'展開所有課程':'收合所有課程'})}document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.go)));if(page==='games'){document.getElementById('gameCategory').addEventListener('change',e=>{gameCategory=e.target.value;gameIndex=0;answered=null;render()});document.getElementById('gameStory').addEventListener('change',e=>{gameIndex=Number(e.target.value);answered=null;render()});document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{answered=Number(b.dataset.choice);render()}));document.getElementById('nextStory').addEventListener('click',()=>{gameIndex=(gameIndex+1)%3;answered=null;render()})}if(page==='practice'){const input=document.getElementById('practiceInput');input.addEventListener('input',()=>{practiceText=input.value});document.getElementById('practiceAnalyze').addEventListener('click',()=>{practiceText=input.value;const out=document.getElementById('practiceResult');out.innerHTML=practiceText.trim()?localInterpret(practiceText):'<div class="feedback" role="alert">請先輸入一段文字，再按產生解讀。</div>'});document.getElementById('practiceClear').addEventListener('click',()=>{practiceText='';input.value='';document.getElementById('practiceResult').innerHTML='';input.focus()})}if(page==='sources'){const input=document.getElementById('sourceSearch');input.addEventListener('input',()=>drawSources(input.value));drawSources()}}
function render(){main.innerHTML=page==='home'?home():page==='national'?course('national'):page==='daily'?course('daily'):page==='games'?game():page==='practice'?practice():sources();bind()}render();
</script></body></html>
