'use strict';const UNITS=[["國家級", "認知作戰究竟是什麼？", "先辨識行動者、目標、手段、受眾與證據；它不等於所有假訊息。", "國家級影響行動通常試圖改變群體對現實的理解、信任與決策。判斷個別事件是否構成認知作戰，需要證據支持，不能只看內容是否令人不舒服。", "一篇讓你憤怒的文章是否必然是認知作戰？", "否。需要調查來源、協同行為、目的與證據。", "S1-P001"], ["國家級", "假訊息、宣傳與認知作戰", "辨識概念差異，不把所有錯誤訊息混為一談。", "假訊息描述資訊真偽問題；宣傳著重說服；認知作戰則關注有策略的影響行動。它們可能重疊，但不能互相取代。", "看到錯誤數字就能推斷幕後是外國政府？", "不能。錯誤資訊與來源歸因是兩個不同問題。", "S1-I001"], ["國家級", "誰在操作？如何歸因？", "區分已知事實、合理推測和未證實指控。", "觀察帳號來源、協同行為、資金、時間序列與可追溯紀錄；單一匿名帳號或相似口號不足以證明特定國家介入。", "多個帳號同時轉發能證明政府指揮嗎？", "不一定，須有更多獨立證據。", "S1-P001"], ["國家級", "情緒、敘事與群體認同", "了解恐懼、憤怒、羞辱如何提高傳播意願。", "內容可能利用對立框架、選擇性事實、恐懼敘事及身份認同來影響判斷；情緒本身不是證據。", "越讓人生氣的內容越可信嗎？", "否。先辨識情緒，再查原始脈絡。", "S1-I003"], ["國家級", "傳播鏈與協同放大", "理解內容如何跨平台、社群和媒體擴散。", "分析誰先發布、誰接力、何時放大；區分自然傳播與可能的協調操作。", "轉發數很高就代表內容是真的嗎？", "否。熱度不是可靠性指標。", "S1-I002"], ["國家級", "真實案例的證據地圖", "用原始研究拆解主張、材料、限制與未知。", "從研究提出的案例開始，依序記錄主張、原始資料、研究方法與限制；網站不自行補造未核實的具體事件細節。", "看到案例摘要，應先查什麼？", "查原始研究、資料來源及作者如何得出結論。", "S1-P001"], ["國家級", "五步查證法", "停、找、比、判、再分享。", "先暫停轉傳；找原始來源；跨來源比較；標示確定與未知；最後決定是否分享。", "訊息缺少日期，最好的第一步是？", "查找最初發布時間與完整上下文。", "S1-I001"], ["國家級", "不確定時如何保持判斷", "學會說「目前證據不足」。", "避免把所有異議視為敵對操作，也避免因資訊疲勞而放棄查證。保持可修正的判斷比快速選邊更重要。", "沒有足夠證據時，最好的回答是？", "說明未知與需要的證據，而非強行定論。", "S1-B001"], ["日常人際", "人際操控與一般衝突", "辨識行為模式，而不是替人貼標籤。", "不合理要求、羞辱、威脅與扭曲責任值得注意；單次爭執不等於蓄意操控，更不是國家級認知作戰。", "一次忘記承諾就能認定對方在操控？", "不能。觀察反覆模式、影響與具體行為。", "S2-D001"], ["日常人際", "職場：責任與證據", "主管改口、模糊指示與甩鍋。", "用書面確認任務、日期和責任；聚焦事實與工作流程，避免在未掌握資訊時揣測動機。", "主管否認口頭指示，第一步？", "整理時間線並以中性語氣書面確認。", "S2-D001"], ["日常人際", "職場：功勞與權力差", "被搶功、會議壓力與界線。", "記錄工作成果與合作紀錄，必要時向可信任的主管或人資求助。", "有人把你的成果說成自己的，你可以？", "提出具體貢獻紀錄，避免人身攻擊。", "S2-D001"], ["日常人際", "生活：朋友與群體壓力", "拒絕情緒勒索與「不合群」標籤。", "能尊重對方情緒，同時保留自己選擇的權利。", "朋友說不答應就是不夠義氣，你可以？", "清楚拒絕並維持尊重。", "S2-D001"], ["日常人際", "生活：群組謠言與界線", "查證訊息，也不被逼迫立刻表態。", "朋友轉傳不實資訊不代表他是認知作戰行動者；先查證，再溫和回應。", "群組催你轉傳未證實消息，最好？", "先核對來源，不因壓力轉發。", "S1-I001"], ["日常人際", "感情：隱私與控制", "辨識索取密碼、定位與社交限制。", "親密不代表必須交出所有帳號、定位或社交自主權。尊重與同意是雙向的。", "伴侶要求密碼才能證明愛，你可以？", "表達在乎，同時拒絕交出密碼。", "S2-G001"], ["日常人際", "感情：否認、反轉與困惑", "認識常被稱為DARVO的反應模式，但不隨意診斷。",  d.name==='親密關係'?'我聽到你的想法了，但我也需要保留自己的選擇與界線。我們可以談具體需求。':
 '我需要一點時間想清楚，再告訴你我的決定。';
 const signalHtml=signals.length?signals.map(x=>`<li><strong>${esc(x[0])}：</strong>${esc(x[1])}</li>`).join(''):'<li>目前沒有明確的關鍵風險訊號，仍需補充對話背景。</li>';
 const specificity=t.length<18?'你提供的文字較短；若能補上對方原話、時間及你的目標，建議會更具體。':`已讀取約 ${t.length} 個字，以下只針對你輸入的內容提出可操作的回應。`;
 return `<div class="feedback" role="status"><strong>🧭 針對這段文字的分析</strong><p class="tiny">${esc(specificity)} · 主要情境：${esc(d.name)}${matched.length>1?'（亦涉及：'+esc(matched.slice(1).map(x=>x.name).join('、'))+'）':''}</p><p><strong>你提供的關鍵原話：</strong>「${esc(excerpts[0].slice(0,110))}」</p><p><strong>從文字看見的訊號：</strong></p><ul class="bullet">${signalHtml}</ul><p><strong>目前不能直接認定：</strong>單憑這段文字無法證實對方的動機、訊息真偽或背後行動者。</p><p><strong>建議先釐清：</strong>${esc(d.question)}</p><p><strong>可以直接使用的回覆：</strong></p><blockquote class="card mint">${esc(response)}</blockquote><p><strong>下一步：</strong>${esc(d.action)}</p>${threat?'<p><strong>🛟 安全優先：</strong>若有立即危險，請聯絡當地緊急服務或可信任的支援者。</p>':''}<p class="tiny">這是依文字線索產生的本機規則分析，不是生成式 AI；不會上傳文字。它能依內容調整訊號與回覆，但無法像 AI 一樣完整理解任意語境。</p></div>`;
}
function practice(){return `<section class="hero"><div><span class="eyebrow">✍️ 可直接輸入，不必登入</span><h1>今日 3 分鐘練習</h1><p>把你遇到的一段訊息或情境寫下來，練習區分「事實、感受、尚未確認的推論、下一步」。</p></div>${mascot}</section><section class="section"><div class="card mint"><label for="practiceInput"><strong>① 寫下你今天想釐清的事情</strong></label><textarea class="field" id="practiceInput" placeholder="例如：主管說這份報告昨天就應該完成，但我記得他說下週……">${esc(practiceText)}</textarea><p class="tiny">🔒 依輸入文字辨識不同線索，提供對應回覆草稿；本機規則無法保證理解所有語意。文字不會上傳或儲存，不呼叫 OpenAI API。</p><button class="btn" id="practiceAnalyze">✨ 分析這段訊息並建議回覆</button> <button class="btn secondary" id="practiceClear">清空文字</button><div id="practiceResult" aria-live="polite"></div></div></section>`}
function sourceCard(s){const link=(url,label)=>url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(label)} ↗</a>`:'';return `<article class="card source"><div><span class="stamp">${esc(s.id)} · ${esc(s.type)}</span></div><h3>${esc(s.title)}</h3><div class="tiny">${esc(s.author)} · ${esc(s.date)} · ${esc(s.track||'')}</div><p>${esc(s.status)}</p>${link(s.url,'主要入口')}${s.alternative&&s.alternative!==s.url?link(s.alternative,s.alternativeLabel||'備援入口'):''}${!s.url&&!s.alternative?'<span class="tiny">⚠️ 尚無可確認的外部入口，不列為正式引用</span>':''}</article>`}
function sources(){return `<section class="hero"><div><span class="eyebrow">📚 來源與查證狀態透明</span><h1>來源資料庫</h1><p>原始研究、訪談、書籍介紹與候選研究分開標示。連結能開啟不等於內容已閱讀或主張已核實。</p></div>${mascot}</section><section class="section"><div class="card"><label for="sourceSearch"><strong>搜尋來源名稱、作者、編號</strong></label><input class="field" id="sourceSearch" type="search" placeholder="例如：沈伯洋、DARVO、認知作戰"><div class="tiny">若外部網站顯示憑證撤銷警告，請勿繞過；改用備援或其他可靠來源。</div><div id="sourceResults" class="grid" style="margin-top:18px"></div></div></section>`}
function drawSources(query=''){const q=query.trim().toLocaleLowerCase();const matches=SOURCES.filter(s=>[s.id,s.title,s.author,s.type,s.track].join(' ').toLocaleLowerCase().includes(q));document.getElementById('sourceResults').innerHTML=matches.length?matches.map(sourceCard).join(''):'<div class="note">沒有找到相符來源，請更換關鍵字。</div>'}
function bind(){if(page==='national'||page==='daily'){document.querySelectorAll('.reveal-answer').forEach(b=>b.addEventListener('click',()=>{const a=b.nextElementSibling;const hidden=a.classList.toggle('hidden');b.setAttribute('aria-expanded',String(!hidden));b.textContent=hidden?'✨ 點我查看參考答案':'🙈 收起參考答案'}));const toggle=document.getElementById('toggleLessons');toggle.addEventListener('click',()=>{const details=[...document.querySelectorAll('details.lesson')];const open=details.some(d=>d.open);details.forEach(d=>d.open=!open);toggle.textContent=open?'展開所有課程':'收合所有課程'})}document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.go)));if(page==='games'){document.getElementById('gameCategory').addEventListener('change',e=>{gameCategory=e.target.value;gameIndex=randomGame(-1);answered=null;render()});document.getElementById('gameStory').addEventListener('change',e=>{gameIndex=Number(e.target.value);answered=null;render()});document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{answered=Number(b.dataset.choice);render()}));document.getElementById('nextStory').addEventListener('click',()=>{gameIndex=randomGame(gameIndex);answered=null;render()})}if(page==='practice'){const input=document.getElementById('practiceInput');input.addEventListener('input',()=>{practiceText=input.value});document.getElementById('practiceAnalyze').addEventListener('click',()=>{practiceText=input.value;const out=document.getElementById('practiceResult');out.innerHTML=practiceText.trim()?localInterpret(practiceText):'<div class="feedback" role="alert">請先輸入一段文字，再按產生解讀。</div>'});document.getElementById('practiceClear').addEventListener('click',()=>{practiceText='';input.value='';document.getElementById('practiceResult').innerHTML='';input.focus()})}if(page==='sources'){const input=document.getElementById('sourceSearch');input.addEventListener('input',()=>drawSources(input.value));drawSources()}}
function render(){main.innerHTML=page==='home'?home():page==='national'?course('national'):page==='daily'?course('daily'):page==='games'?game():page==='practice'?practice():sources();bind()}render();
</script></body></html>
